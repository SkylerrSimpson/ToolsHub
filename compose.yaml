name: tools-hub
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tools_hub
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: tools_hub
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - tools_hub_postgres:/var/lib/postgresql/data
      - ./scripts/init-test-database.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tools_hub -d tools_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tools_hub_postgres:
