name: Checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tools_hub
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: tools_hub
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U tools_hub -d tools_hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tools_hub:local-development-only@127.0.0.1:55432/tools_hub
      TEST_DATABASE_URL: postgres://tools_hub_test:local-test-only@127.0.0.1:55432/tools_hub_test
      BROWSER_DATABASE_URL: postgres://tools_hub_test:local-test-only@127.0.0.1:55432/tools_hub_test
      APP_ORIGIN: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-test-database.sql
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: DATABASE_URL="$BROWSER_DATABASE_URL" pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
